run_profile:
  name: weekly_defensive_validation
  environment: nonprod
  require_signed_scope: true
  require_allowlist: true
  stop_on_scope_mismatch: true
  stop_on_window_expiry: true

phases:
  - name: inventory
    enabled: true
    runners: [inventory, osquery, wazuh]

  - name: service_validation
    enabled: true
    runners: [nmap]

  - name: authenticated_vuln
    enabled: true
    runners: [greenbone, wazuh]

  - name: config_audit
    enabled: true
    runners: [lynis]

  - name: web_checks
    enabled: false
    allowed_environments: [staging, lab]
    runners: [zap, nikto, nuclei]

  - name: cloud_posture
    enabled: true
    runners: [prowler, scoutsuite]

workflow:
  import_defectdojo: true
  index_opensearch: true
  create_tickets: true
  deduplicate: true
